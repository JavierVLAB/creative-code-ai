name: mosaico-arcos

modules:
  canvas:
    width: 640
    height: 640

  tamano_grid:
    type: range
    label: Tamaño de grid
    min: 2
    max: 16
    step: 1
    default: 8

  paleta:
    type: select
    label: Paleta
    options:
      - label: Azul noche
        value: azul-noche
      - label: Fuego
        value: fuego
      - label: Bosque
        value: bosque
      - label: Contraste
        value: contraste
    default: azul-noche

  grosor_linea:
    type: range
    label: Grosor de línea
    min: 0.5
    max: 4
    step: 0.1
    default: 1.5

  semilla:
    type: range
    label: Semilla
    min: 0
    max: 1000
    step: 1
    default: 1

  solo_lineas:
    type: select
    label: Solo líneas
    options:
      - label: No
        value: 'no'
      - label: Sí
        value: 'si'
    default: 'no'
